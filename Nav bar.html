<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=!, initial-scale=1.0">
    <title>Learn about nav ar (Navigation bar) with me!</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        .topnav {
            overflow: hidden;
            background-color: #6deade;
        }

        .topnav a {
            float: left;
            color: #6494e2;
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
            font-size: 17px;
        }

        .topnav a:hover {
            background-color: #63ed78;
            color: rgb(235, 224, 224);
        }

        .topnav a.active {
            background-color: #74f2ea;
            color: rgb(247, 245, 245);
        }

        img {
            position: relative;
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-width: 400px;
            min-height: 400px;
        }
    </style>
</head>

<body>
    <div class="topnav">
        <a class="active" href="#home">Home</a>
        <a href="#">About_us</a>
        <a href="#">Gallery</a>
        <a href="#">Contact_us</a>
    </div>
    <section>
        <image class="MySlides" src="images.jpg" style="height:400px; width:100%;"></image>
        <image class="MySlides" src="images (1).jpg" style="height:400px; width:100%;"></image>
    </section>
    <script>
        // Automatic slideshow - change image every 3 seconds
        var myIndex = 0;
        carousel();

        function carousel() {
            var i;
            var x = document.getElementsByClassName("MySlides");
            for (i = 0; i < x.length; i++) {
                x[i].style.display = "none";
            }
            myIndex++;
            if (myIndex > x.length) { myIndex = 1 }
            x[myIndex - 1].style.display = "block";
            setTimeout(carousel, 3000);

        }
    </script>

</body>

</html>
